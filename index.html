  <title>取消拿藥申請｜瑞恩中醫</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        Arial,
        sans-serif;

      color: #40372f;
    }

    body {
      min-height: 100vh;

      background:
        linear-gradient(
          180deg,
          #fbf8f3 0%,
          #f6f0e8 100%
        );

      padding:
        22px
        16px
        50px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }


    /* ============================
       HERO
    ============================ */

    .hero {
      position: relative;

      min-height: 310px;

      padding:
        28px
        30px
        25px
        32px;

      overflow: hidden;

      isolation: isolate;
    }


    /* ============================
       瑞恩中醫品牌
    ============================ */

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;

      padding-bottom: 9px;

      border-bottom:
        1px solid
        #dec8ae;

      position: relative;
      z-index: 5;
    }

    .brand-mark {
      width: 38px;
      height: 38px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-mark svg {
      width: 100%;
      height: 100%;
    }

    .brand-name {
      font-size: 23px;
      font-weight: 700;

      letter-spacing: 2px;

      color: #6a4933;
    }


    /* ============================
       標題
    ============================ */

    .title-row {
      display: flex;
      align-items: center;

      gap: 15px;

      margin-top: 38px;

      position: relative;
      z-index: 5;
    }

    .cancel-icon {
      width: 62px;
      height: 62px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 16px;

      background:
        rgba(
          239,
          224,
          205,
          .72
        );

      border:
        1px solid
        rgba(
          190,
          154,
          117,
          .25
        );

      box-shadow:
        0 5px 14px
        rgba(
          110,
          75,
          45,
          .06
        );
    }

    .cancel-icon svg {
      width: 39px;
      height: 39px;
    }

    h1 {
      margin: 0;

      color: #5e3e29;

      font-size: 40px;

      line-height: 1.15;

      letter-spacing: 1px;
    }

    .subtitle {
      margin-top: 17px;

      color: #78685b;

      font-size: 17px;

      line-height: 1.8;

      position: relative;
      z-index: 5;
    }


/* ============================
   Q版人物背景
   清晰版
============================ */

.character-area {
  position: absolute;

  top: -8px;
  right: 18px;

  width: 470px;
  height: 335px;

  z-index: -1;

  pointer-events: none;
}

.character-image {
  position: absolute;

  inset: 0;

  background:
    url("https://i.ibb.co/Z1kPkDK9/image.jpg")
    right center
    / contain
    no-repeat;

  opacity: 1;
}


/* 左側只保留非常輕微的融合 */
.character-area::before {
  content: "";

  position: absolute;

  inset: 0;

  z-index: 1;

  background:
    linear-gradient(
      90deg,

      #fbf8f3 0%,

      rgba(251,248,243,.55) 7%,

      rgba(251,248,243,.18) 18%,

      rgba(251,248,243,.03) 30%,

      rgba(251,248,243,0) 42%
    );
}


/* 下方柔和淡出 */
.character-area::after {
  content: "";

  position: absolute;

  inset: 0;

  z-index: 2;

  background:
    linear-gradient(
      180deg,

      rgba(251,248,243,0) 78%,

      rgba(251,248,243,.08) 88%,

      rgba(251,248,243,.28) 100%
    );
}

    /* 下方輕微融合 */
    .character-area::after {
      content: "";

      position: absolute;

      inset: 0;

      z-index: 2;

      background:
        linear-gradient(
          180deg,

          rgba(251,248,243,0) 72%,

          rgba(251,248,243,.10) 86%,

          rgba(251,248,243,.45) 100%
        );
    }


    /* ============================
       NOTICE
    ============================ */

    .notice {
      margin-top: 4px;

      padding:
        16px
        20px;

      border-radius: 17px;

      background: #f8efe5;

      border:
        1px solid
        #ead5bf;

      color: #805b42;

      font-size: 15px;

      line-height: 1.8;
    }

    .notice-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .notice-icon {
      width: 24px;
      height: 24px;

      flex-shrink: 0;

      margin-top: 1px;
    }


    /* ============================
       FORM CARD
    ============================ */

    .card {
      margin-top: 26px;

      padding: 30px;

      border-radius: 27px;

      background:
        rgba(
          255,
          253,
          249,
          .98
        );

      border:
        1px solid
        rgba(
          177,
          146,
          113,
          .14
        );

      box-shadow:
        0 11px 38px
        rgba(
          81,
          61,
          42,
          .11
        );
    }

    #status {
      margin-bottom: 27px;

      padding: 16px;

      border-radius: 15px;

      background: #f7efe5;

      color: #705c49;

      text-align: center;

      font-size: 15px;

      line-height: 1.7;
    }

    #medicineData {
      display: none;
    }

    .field {
      margin-bottom: 25px;
    }

    .label {
      display: block;

      margin-bottom: 10px;

      color: #5e4938;

      font-size: 16px;

      font-weight: 700;
    }

    .required {
      color: #cb5149;
      margin-left: 3px;
    }

    input,
    select,
    textarea {
      width: 100%;

      padding:
        14px
        15px;

      border:
        1px solid
        #d9c7b6;

      border-radius: 14px;

      background: #fff;

      color: #40372f;

      font-size: 16px;

      outline: none;

      transition: .2s;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #a98560;

      box-shadow:
        0 0 0 3px
        rgba(
          169,
          133,
          96,
          .13
        );
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .time-grid {
      display: grid;

      grid-template-columns:
        1fr
        .75fr;

      gap: 12px;
    }

    #otherDaysBox,
    #otherReasonBox {
      display: none;
      margin-top: 12px;
    }


    /* ============================
       取消原因
    ============================ */

    .reason-group {
      display: flex;
      flex-direction: column;

      gap: 11px;
    }

    .reason-item {
      display: flex;
      align-items: center;

      gap: 11px;

      padding:
        15px
        16px;

      border:
        1px solid
        #ded0c2;

      border-radius: 14px;

      background: #fff;

      cursor: pointer;

      transition: .2s;
    }

    .reason-item:hover {
      background: #fffaf5;
      border-color: #ba997a;
    }

    .reason-item input {
      width: auto;

      margin: 0;

      transform: scale(1.15);
    }

    .small-note {
      margin-top: 8px;

      color: #9a8878;

      font-size: 13px;
    }


    /* ============================
       WARNING
    ============================ */

    .warning {
      margin-top: 10px;

      padding:
        14px
        15px;

      border-radius: 14px;

      background: #fff1ec;

      color: #985044;

      font-size: 14px;

      line-height: 1.75;
    }


    /* ============================
       BUTTON
    ============================ */

    button {
      width: 100%;

      margin-top: 25px;

      padding: 16px;

      border: none;

      border-radius: 15px;

      background:
        linear-gradient(
          135deg,
          #c86149,
          #b7533f
        );

      color: #fff;

      font-size: 18px;

      font-weight: 700;

      cursor: pointer;

      box-shadow:
        0 6px 16px
        rgba(
          170,
          76,
          53,
          .16
        );

      transition: .2s;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: .55;
      transform: none;
      cursor: not-allowed;
    }


    /* ============================
       SUCCESS
    ============================ */

    #successPage {
      display: none;
      text-align: center;
    }

    .success-icon {
      font-size: 65px;
      margin-bottom: 12px;
    }

    .success-title {
      color: #72513b;
      font-size: 25px;
      font-weight: 700;
    }

    .success-text {
      margin-top: 12px;
      color: #71665d;
      line-height: 1.85;
    }

    .footer {
      margin-top: 22px;
      text-align: center;
      color: #8c7768;
      font-size: 14px;
    }


/* ============================
   MOBILE
============================ */

@media(max-width: 700px) {

  body {
    padding:
      12px
      10px
      40px;
  }


  /* =========================
     手機 HERO
  ========================= */

  .hero {
    position: relative;

    min-height: 245px;

    padding:
      18px
      12px
      18px
      12px;

    overflow: hidden;

    isolation: isolate;

  /* =========================

  ========================= */

  .brand {
    position: relative;

    z-index: 10;

  .brand-name {
    font-size: 18px;

    white-space: nowrap;
  }


  /* =========================

  ========================= */

  .title-row {
    position: relative;

    z-index: 10;

    display: flex;

    align-items: center;

    gap: 9px;

    margin-top: 30px;

    width: 62%;
  }


  .cancel-icon {
    width: 42px;
    height: 42px;

    min-width: 42px;

    border-radius: 11px;
  }


  .cancel-icon svg {
    width: 27px;
    height: 27px;
  }


  h1 {
    font-size: 27px;

    line-height: 1.15;

    letter-spacing: 0;

    white-space: nowrap;

    position: relative;

    z-index: 10;
  }


  /* =========================

  ========================= */

  .subtitle {
    position: relative;

    z-index: 10;

    width: 58%;

    max-width: 58%;

    margin-top: 14px;

    font-size: 14px;

    line-height: 1.7;

    color: #75665a;
  }


  /* =========================
     人物
  ========================= */

  .character-area {
    position: absolute;

    top: 8px;

    right: -20px;

    width: 205px;

    height: 225px;

    z-index: 1;

    pointer-events: none;
  }


  .character-image {
    position: absolute;

    inset: 0;

    background:
      url("https://i.ibb.co/Z1kPkDK9/image.jpg")
      right top
      / contain
      no-repeat;

    opacity: 1;
  }


  /*
   * 靠近文字的左側
   * 只稍微淡化
   */
  .character-area::before {
    content: "";

    position: absolute;

    inset: 0;

    z-index: 2;

    background:
      linear-gradient(
        90deg,

        #fbf8f3 0%,

        rgba(251,248,243,.70) 8%,

        rgba(251,248,243,.26) 20%,

        rgba(251,248,243,.04) 32%,

        rgba(251,248,243,0) 42%
      );
  }


  /*
   * 人物底部輕微融入背景
   */
  .character-area::after {
    content: "";

    position: absolute;

    inset: 0;

    z-index: 3;

    background:
      linear-gradient(
        180deg,

        rgba(251,248,243,0) 82%,

        rgba(251,248,243,.08) 92%,

        rgba(251,248,243,.20) 100%
      );
  }


  /* =========================
     提示框
  ========================= */

  .notice {
    margin-top: 2px;

    padding:
      13px
      14px;

    border-radius: 14px;

    font-size: 13px;

    line-height: 1.75;
  }


  .notice-row {
    gap: 8px;
  }


  .notice-icon {
    width: 21px;
    height: 21px;
  }


  /* =========================
     表單
  ========================= */

  .card {
    margin-top: 18px;

    padding:
      20px
      17px;

    border-radius: 22px;
  }


  #status {
    margin-bottom: 22px;

    padding:
      14px
      10px;

    font-size: 14px;
  }


  .label {
    font-size: 16px;
  }


  input,
  select,
  textarea {
    min-height: 52px;

    font-size: 16px;

    border-radius: 13px;
  }


  /* 日期與時段手機上下排列 */
  .time-grid {
    grid-template-columns:
      1fr;

    gap: 10px;
  }


  .reason-item {
    min-height: 55px;

    padding:
      14px
      15px;
  }


  button {
    min-height: 54px;

    font-size: 17px;
  }

}

  </style>

</head>

<div class="container">

  <section class="hero">

            y2="23"

          />

          <line
            x1="21"
            y1="31"

          />

        </svg>

      </div>

      <h1>
        取消拿藥申請
      </h1>

    </div>


    <div class="subtitle">
      系統會自動查詢您最近一次的拿藥申請
    </div>


    <!-- 人物背景 -->

    <div class="character-area">

      <div class="character-image"></div>

    </div>

  </section>


  <!-- ============================
       NOTICE
  ============================ -->

  <div class="notice">

    <div class="notice-row">

      <svg
        class="notice-icon"
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
      >

        <path
          d="M12 3
             C8.7 3 7 5.5 7 8.5
             V12
             L5 16
             H19
             L17 12
             V8.5
             C17 5.5 15.3 3 12 3Z"
          fill="#e9c99d"

        <path
          d="M10 19
             C10.5 20.5 13.5 20.5 14 19"
          fill="none"
          stroke="#845f44"
          stroke-width="1.5"
        />

      </svg>


      <span>

        本表單僅提供取消拿藥，
        若需要修改拿藥時間或是內容，
        請再重新填寫照拿藥表單。

      </span>

    </div>

  </div>


  <!-- ============================
       FORM
  ============================ -->

  <div
    class="card"
    id="mainCard"
  >

    <div id="status">

      正在連接 LINE 並查詢您的拿藥資料...

    </div>


    <div id="medicineData">


      <!-- 姓名 -->

      <div class="field">

        <label class="label">

          姓名

          <span class="required">
            *
          </span>

        </label>


        <input
          id="name"
          type="text"
          placeholder="請輸入姓名"
        >

      </div>


      <!-- 拿藥天數 -->

      <div class="field">

        <label class="label">

          原本拿藥天數

          <span class="required">
            *
          </span>

        </label>


        <select
          id="medicineDays"
          onchange="medicineDaysChanged()"
        >

          <option value="">
            請選擇拿藥天數
          </option>

          <option value="3天">3天</option>
          <option value="4天">4天</option>
          <option value="5天">5天</option>
          <option value="6天">6天</option>
          <option value="7天">7天</option>
          <option value="8天">8天</option>
          <option value="9天">9天</option>
          <option value="10天">10天</option>
          <option value="11天">11天</option>
          <option value="12天">12天</option>
          <option value="13天">13天</option>
          <option value="14天">14天</option>

          <option value="其他">
            其他
          </option>

        </select>


        <div id="otherDaysBox">

          <input
            id="otherDays"
            type="number"
            min="1"
            max="99"
            placeholder="請輸入其他拿藥天數"
          >

        </div>

      </div>


      <!-- 取藥時間 -->

      <div class="field">

        <label class="label">

          原本預計取藥時間

          <span class="required">
            *
          </span>

        </label>


        <div class="time-grid">

          <input
            type="date"
            id="pickupDate"
          >


          <select id="pickupPeriod">

            <option value="">
              請選擇時段
            </option>

            <option value="上午">
              上午
            </option>

            <option value="下午">
              下午
            </option>

            <option value="晚上">
              晚上
            </option>

          </select>

        </div>

      </div>


      <!-- 取消原因 -->

      <div class="field">

        <label class="label">

          取消原因

          <span class="required">
            *
          </span>

        </label>


        <div class="reason-group">


          <label class="reason-item">

            <input
              type="radio"
              name="cancelReason"
              value="改其他時間取藥"
              onchange="reasonChanged()"
            >

            改其他時間取藥

          </label>


          <label class="reason-item">

            <input
              type="radio"
              name="cancelReason"
              value="藥物效果不佳"
              onchange="reasonChanged()"
            >

            藥物效果不佳

          </label>


          <label class="reason-item">

            <input
              type="radio"
              name="cancelReason"
              value="其他"
              onchange="reasonChanged()"
            >

            其他(可不填寫)

          </label>

        </div>


        <div id="otherReasonBox">

          <textarea
            id="otherReason"
            placeholder="若有其他原因或補充內容，可在此填寫"

            此欄位可不填寫

          </div>

        </div>

      </div>


      <div class="warning">

        ⚠️ 送出後會建立取消拿藥紀錄，

      </div>


      <button
        id="cancelButton"
        onclick="cancelMedicine()"
      >

        確認取消

      </button>

    瑞恩中醫｜關心您的健康

  </div>

 * 設定
 ************************************************/

const LIFF_ID =
  "2011216294-KZGH20MJ";

const GAS_URL =
  "https://script.google.com/macros/s/AKfycby1MuKhtiGBlgsm20eavpZtn4fNryc6Hs8pRhE1PZ2Kr6cQ3DM3FnOhNKYPgJ0MYpIbbw/exec";


/************************************************
 * 狀態
 ************************************************/

let currentUserID =
  "";

let currentUserName =
  "";

let currentRowNumber =
  null;

let foundOriginalRecord =
  false;


/************************************************
 * 啟動
 ************************************************/

window.addEventListener(
  "load",
  initializePage
);


/************************************************
 * LIFF
 ************************************************/

async function initializePage() {

  try {

    await liff.init({
      liffId: LIFF_ID
    });


    if (
      !liff.isLoggedIn()
    ) {

      liff.login();

      return;

    }


    const profile =
      await liff.getProfile();


    currentUserID =
      profile.userId || "";


    currentUserName =
      profile.displayName || "";


    if (
      !currentUserID
    ) {

      throw new Error(
        "沒有取得 LINE userID"
      );

    }


    await loadMedicineData();


  } catch(error) {

    console.error(
      error
    );


    showManualMode(
      "目前無法自動帶入資料，請自行填寫取消資料"
    );

  }

}


/************************************************
 * 查詢
 ************************************************/

async function loadMedicineData() {

  try {

    const url =
      GAS_URL +
      "?action=getLatest" +
      "&userID=" +
      encodeURIComponent(
        currentUserID
      ) +
      "&t=" +
      Date.now();


    const response =
      await fetch(
        url,
        {

          method:
            "GET",

          cache:
            "no-store"

        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "GAS 回應異常"
      );

    }


    const result =
      await response.json();


    if (
      !result.found
    ) {

      showManualMode(
        "目前沒有找到拿藥申請，請自行填寫取消資料"
      );

      return;

    }


    foundOriginalRecord =
      true;


    currentRowNumber =
      result.rowNumber;


    document
      .getElementById(
        "status"
      )
      .innerText =
        "已找到您的拿藥申請，可確認或修改以下資料";


    document
      .getElementById(
        "name"
      )
      .value =
        result.name || "";


    setMedicineDays(
      result.medicineDays
    );


    setPickupTime(
      result.pickupTime
    );


    document
      .getElementById(
        "medicineData"
      )
      .style.display =
        "block";


  } catch(error) {

    console.error(
      error
    );


    showManualMode(
      "目前無法自動帶入資料，請自行填寫取消資料"
    );

  }

}


/************************************************
 * 手動模式
 ************************************************/

function showManualMode(
  message
) {

  foundOriginalRecord =
    false;


  currentRowNumber =
    null;


  document
    .getElementById(
      "status"
    )
    .innerText =
      message;


  if (
    currentUserName
  ) {

    document
      .getElementById(
        "name"
      )
      .value =
        currentUserName;

  }


  document
    .getElementById(
      "medicineData"
    )
    .style.display =
      "block";

}


/************************************************
 * 天數
 ************************************************/

function setMedicineDays(
  value
) {

  const raw =
    String(
      value || ""
    ).trim();


  const match =
    raw.match(
      /\d+/
    );


  if (
    !match
  ) {

    return;

  }


  const days =
    Number(
      match[0]
    );


  const select =
    document.getElementById(
      "medicineDays"
    );


  if (
    days >= 3 &&
    days <= 14
  ) {

    select.value =
      days + "天";

  } else {

    select.value =
      "其他";


    document
      .getElementById(
        "otherDays"
      )
      .value =
        days;


    document
      .getElementById(
        "otherDaysBox"
      )
      .style.display =
        "block";

  }

}


function medicineDaysChanged() {

  const value =
    document
      .getElementById(
        "medicineDays"
      )
      .value;


  const box =
    document.getElementById(
      "otherDaysBox"
    );


  if (
    value ===
      "其他"
  ) {

    box.style.display =
      "block";

  } else {

    box.style.display =
      "none";


    document
      .getElementById(
        "otherDays"
      )
      .value =
        "";

  }

}


function getMedicineDays() {

  const selected =
    document
      .getElementById(
        "medicineDays"
      )
      .value;


  if (
    !selected
  ) {

    return "";

  }


  if (
    selected !==
      "其他"
  ) {

    return selected;

  }


  const other =
    document
      .getElementById(
        "otherDays"
      )
      .value
      .trim();


  if (
    !other
  ) {

    return "";

  }


  return (
    other +
    "天"
  );

}


/************************************************
 * 取藥時間
 ************************************************/

function setPickupTime(
  value
) {

  const text =
    String(
      value || ""
    ).trim();


  const match =
    text.match(
      /(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/
    );


  if (
    match
  ) {

    const y =
      match[1];


    const m =
      String(
        match[2]
      )
      .padStart(
        2,
        "0"
      );


    const d =
      String(
        match[3]
      )
      .padStart(
        2,
        "0"
      );


    document
      .getElementById(
        "pickupDate"
      )
      .value =
        `${y}-${m}-${d}`;

  }


  const period =
    document.getElementById(
      "pickupPeriod"
    );


  if (
    text.includes(
      "上午"
    )
  ) {

    period.value =
      "上午";


  } else if (
    text.includes(
      "下午"
    )
  ) {

    period.value =
      "下午";


  } else if (
    text.includes(
      "晚上"
    )
  ) {

    period.value =
      "晚上";

  }

}


/************************************************
 * 取消原因
 ************************************************/

function reasonChanged() {

  const selected =
    document.querySelector(
      'input[name="cancelReason"]:checked'
    );


  const box =
    document.getElementById(
      "otherReasonBox"
    );


  if (
    selected &&
    selected.value ===
      "其他"
  ) {

    box.style.display =
      "block";

  } else {

    box.style.display =
      "none";


    document
      .getElementById(
        "otherReason"
      )
      .value =
        "";

  }

}


function getCancelReason() {

  const selected =
    document.querySelector(
      'input[name="cancelReason"]:checked'
    );


  if (
    !selected
  ) {

    return "";

  }


  if (
    selected.value ===
      "其他"
  ) {

    const other =
      document
        .getElementById(
          "otherReason"
        )
        .value
        .trim();


    return other
      ? "其他：" + other
      : "其他";

  }


  return selected.value;

}


/************************************************
 * 送出
 ************************************************/

async function cancelMedicine() {

  const name =
    document
      .getElementById(
        "name"
      )
      .value
      .trim();


  const medicineDays =
    getMedicineDays();


  const pickupDate =
    document
      .getElementById(
        "pickupDate"
      )
      .value;


  const pickupPeriod =
    document
      .getElementById(
        "pickupPeriod"
      )
      .value;


  const cancelReason =
    getCancelReason();


  if (
    !name
  ) {

    alert(
      "請填寫姓名"
    );

    return;

  }


  if (
    !medicineDays
  ) {

    alert(
      "請選擇或輸入原本拿藥天數"
    );

    return;

  }


  if (
    !pickupDate
  ) {

    alert(
      "請選擇原本預計取藥日期"
    );

    return;

  }


  if (
    !pickupPeriod
  ) {

    alert(
      "請選擇原本預計取藥時段"
    );

    return;

  }


  if (
    !cancelReason
  ) {

    alert(
      "請選擇取消原因"
    );

    return;

  }


  const pickupTime =
    pickupDate +
    " " +
    pickupPeriod;


  const payload = {

    action:
      "cancelMedicine",

    rowNumber:
      currentRowNumber,

    foundOriginalRecord:
      foundOriginalRecord,

    name:
      name,

    userID:
      currentUserID,

    userName:
      currentUserName,

    medicineDays:
      medicineDays,

    pickupTime:
      pickupTime,

    cancelReason:
      cancelReason

  };


  const button =
    document.getElementById(
      "cancelButton"
    );


  button.disabled =
    true;


  button.innerText =
    "送出中...";


  try {

    const response =
      await fetch(
        GAS_URL,
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify(
              payload
            )

        }
      );


    const result =
      await response.json();


    if (
      !result.success
    ) {

      throw new Error(
        result.message ||
        "取消失敗"
      );

    }


    document
      .getElementById(
        "mainCard"
      )
      .style.display =
        "none";


    document
      .getElementById(
        "successPage"
      )
      .style.display =
        "block";


    window.scrollTo({

      top: 0,

      behavior:
        "smooth"

    });


  } catch(error) {

    button.disabled =
      false;


    button.innerText =
      "確認取消";


    alert(
      "送出失敗：" +
      (
        error.message ||
        String(error)
      )
    );

  }

}

</script>

</body>

</html>
