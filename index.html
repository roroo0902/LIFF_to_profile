
<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  >

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <title>取消拿藥申請</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        Arial,
        sans-serif;
      color: #40372f;
    }

    body {
      min-height: 100vh;
      background: #f7f3ee;
      padding: 24px 16px 50px;
      position: relative;
      overflow-x: hidden;
    }

    /* 背景人物縮小、淡化 */
    body::before {
      content: "";
      position: fixed;
      inset: 0;

      background:
        url("https://i.ibb.co/Z1kPkDK9/image.jpg")
        center 58% / min(340px, 72vw) auto
        no-repeat;

      opacity: 0.12;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .header {
      text-align: center;
      margin-bottom: 18px;
    }

    .header-icon {
      font-size: 42px;
      margin-bottom: 6px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      color: #674b34;
    }

    .subtitle {
      margin-top: 8px;
      font-size: 15px;
      color: #7c6d61;
      line-height: 1.7;
    }

    .notice {
      margin-top: 14px;
      padding: 14px 15px;
      border-radius: 14px;
      background: #f8efe5;
      border: 1px solid #eadaca;

      color: #865f43;
      font-size: 14px;
      line-height: 1.75;
      text-align: left;
    }

    .card {
      background: rgba(255, 252, 247, 0.96);
      border-radius: 22px;
      padding: 24px;

      border:
        1px solid
        rgba(175, 145, 110, 0.18);

      box-shadow:
        0 8px 30px
        rgba(80, 60, 40, 0.13);

      backdrop-filter: blur(5px);
    }

    #status {
      text-align: center;
      margin-bottom: 20px;
      padding: 13px;

      border-radius: 12px;
      background: #f7efe5;

      color: #705c49;
      font-size: 14px;
      line-height: 1.7;
    }

    #medicineData {
      display: none;
    }

    .field {
      margin-bottom: 23px;
    }

    .label {
      display: block;
      margin-bottom: 9px;

      font-size: 15px;
      font-weight: 700;

      color: #5e4938;
    }

    .required {
      color: #c9564f;
      margin-left: 3px;
    }

    .readonly-box {
      width: 100%;
      padding: 13px 14px;

      border:
        1px solid
        #e3d8cc;

      border-radius: 12px;

      background: #f8f3ed;

      color: #51483f;
      font-size: 16px;
      line-height: 1.6;
    }

    .reason-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .reason-item {
      display: flex;
      align-items: center;
      gap: 10px;

      padding: 13px 14px;

      border:
        1px solid
        #dfd2c6;

      border-radius: 12px;

      background:
        rgba(
          255,
          255,
          255,
          0.86
        );

      cursor: pointer;
      transition: 0.2s;
    }

    .reason-item:hover {
      border-color: #b99a7c;
      background: #fffaf5;
    }

    .reason-item input {
      width: auto;
      margin: 0;
      transform: scale(1.15);
    }

    textarea {
      width: 100%;
      min-height: 92px;

      margin-top: 12px;
      padding: 13px 14px;

      border:
        1px solid
        #d8c8b9;

      border-radius: 12px;

      background: white;

      font-size: 16px;
      color: #40372f;

      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: #a98560;

      box-shadow:
        0 0 0 3px
        rgba(
          169,
          133,
          96,
          0.13
        );
    }

    #otherReasonBox {
      display: none;
    }

    .warning {
      margin-top: 8px;
      padding: 13px;

      border-radius: 12px;

      background: #fff4ef;

      color: #9b5145;

      font-size: 14px;
      line-height: 1.7;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 15px;

      border: none;
      border-radius: 14px;

      background: #a35e4d;

      color: white;

      font-size: 17px;
      font-weight: 700;

      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #8f4f40;
    }

    button:disabled {
      opacity: 0.58;
      cursor: not-allowed;
    }

    #successPage {
      display: none;
      text-align: center;
    }

    .success-icon {
      font-size: 64px;
      margin-bottom: 14px;
    }

    .success-title {
      font-size: 24px;
      font-weight: 700;
      color: #72513b;
      margin-bottom: 10px;
    }

    .success-text {
      font-size: 15px;
      color: #71665d;
      line-height: 1.8;
    }

    .small-note {
      margin-top: 8px;
      color: #9a8878;
      font-size: 13px;
      line-height: 1.6;
    }

    @media(max-width: 480px) {

      body {
        padding:
          18px
          12px
          40px;
      }

      body::before {
        background-size:
          min(280px, 68vw)
          auto;

        background-position:
          center 62%;

        opacity: 0.10;
      }

      .card {
        padding:
          20px
          17px;
      }

      h1 {
        font-size: 25px;
      }

    }

  </style>
</head>

<body>

<div class="container">

  <!-- 標題 -->
  <div class="header">

    <div class="header-icon">
      🌿
    </div>

    <h1>
      取消拿藥申請
    </h1>

    <div class="subtitle">
      系統會自動帶入您最近一次的拿藥申請
    </div>

    <div class="notice">
      本表單僅提供取消拿藥，若需要修改拿藥時間或是內容，請再重新填寫照拿藥表單
    </div>

  </div>

  <!-- 主卡片 -->
  <div
    class="card"
    id="mainCard"
  >

    <div id="status">
      正在連接 LINE 並查詢您的拿藥資料...
    </div>

    <div id="medicineData">

      <!-- 姓名 -->
      <div class="field">

        <label class="label">
          姓名
        </label>

        <div
          id="name"
          class="readonly-box"
        ></div>

      </div>

      <!-- 原本拿藥天數 -->
      <div class="field">

        <label class="label">
          原本拿藥天數
          <span class="required">*</span>
        </label>

        <div
          id="medicineDaysDisplay"
          class="readonly-box"
        ></div>

      </div>

      <!-- 原本預計取藥時間 -->
      <div class="field">

        <label class="label">
          原本預計取藥時間
          <span class="required">*</span>
        </label>

        <div
          id="pickupTimeDisplay"
          class="readonly-box"
        ></div>

      </div>

      <!-- 取消原因 -->
      <div class="field">

        <label class="label">
          取消原因
          <span class="required">*</span>
        </label>

        <div class="reason-group">

          <label class="reason-item">

            <input
              type="radio"
              name="cancelReason"
              value="改其他時間取藥"
              onchange="reasonChanged()"
            >

            <span>
              改其他時間取藥
            </span>

          </label>

          <label class="reason-item">

            <input
              type="radio"
              name="cancelReason"
              value="藥物效果不佳"
              onchange="reasonChanged()"
            >

            <span>
              藥物效果不佳
            </span>

          </label>

          <label class="reason-item">

            <input
              type="radio"
              name="cancelReason"
              value="其他"
              onchange="reasonChanged()"
            >

            <span>
              其他(可不填寫)
            </span>

          </label>

        </div>

        <!-- 其他補充 -->
        <div id="otherReasonBox">

          <textarea
            id="otherReason"
            placeholder="若有其他原因或補充內容，可在此填寫"
          ></textarea>

          <div class="small-note">
            此欄位可不填寫
          </div>

        </div>

      </div>

      <div class="warning">
        ⚠️ 送出後會建立取消拿藥紀錄，若仍需要拿藥，請重新填寫照拿藥表單。
      </div>

      <button
        id="cancelButton"
        onclick="cancelMedicine()"
      >
        確認取消
      </button>

    </div>

  </div>

  <!-- 成功畫面 -->
  <div
    class="card"
    id="successPage"
  >

    <div class="success-icon">
      ✅
    </div>

    <div class="success-title">
      已完成取消
    </div>

    <div class="success-text">
      您的取消拿藥申請已成功送出。<br>
      診所將依照最新資料進行後續處理。
    </div>

  </div>

</div>

<script>

/************************************************
 * 請修改成自己的資料
 ************************************************/

const LIFF_ID =
  "2011216294-KZGH20MJ";

const GAS_URL =
  "https://script.google.com/macros/s/AKfycbwgqmsN3rUW46S6DcgU5YWcidvA1aDXvYVplprnd6WUl0qZABe6uIUmjvArDVw4XxLxkg/exec";


/************************************************
 * 目前 LINE 使用者
 ************************************************/

let currentUserID =
  "";

let currentUserName =
  "";

let currentRowNumber =
  null;

let currentMedicineDays =
  "";

let currentPickupTime =
  "";


/************************************************
 * 頁面啟動
 ************************************************/

window.addEventListener(
  "load",
  initializePage
);


/************************************************
 * 初始化 LIFF
 ************************************************/

async function initializePage() {

  try {

    await liff.init({
      liffId: LIFF_ID
    });


    /*
     * GitHub Pages 是一般 HTTPS 頁面，
     * 若使用者尚未登入 LINE，
     * 則執行登入。
     */
    if (
      !liff.isLoggedIn()
    ) {

      liff.login();

      return;

    }


    const profile =
      await liff.getProfile();


    currentUserID =
      profile.userId || "";


    currentUserName =
      profile.displayName || "";


    if (
      !currentUserID
    ) {

      throw new Error(
        "沒有取得 LINE userID"
      );

    }


    document
      .getElementById(
        "status"
      )
      .innerText =
        "正在查詢您的拿藥資料...";


    await loadMedicineData();


  } catch(error) {

    console.error(
      error
    );


    document
      .getElementById(
        "status"
      )
      .innerText =
        "資料讀取失敗：" +
        (
          error.message ||
          String(error)
        );

  }

}


/************************************************
 * 查詢最近一次可取消的拿藥資料
 ************************************************/

async function loadMedicineData() {

  try {

    const url =
      GAS_URL +

      "?action=getLatest" +

      "&userID=" +

      encodeURIComponent(
        currentUserID
      ) +

      "&t=" +

      Date.now();


    const response =
      await fetch(
        url,
        {
          method: "GET",
          cache: "no-store"
        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "GAS 回應異常"
      );

    }


    const result =
      await response.json();


    if (
      !result.found
    ) {

      document
        .getElementById(
          "status"
        )
        .innerText =
          result.message ||
          "目前沒有可取消的拿藥申請";


      return;

    }


    /********************************
     * 保存原始資料
     ********************************/

    currentRowNumber =
      result.rowNumber;


    currentMedicineDays =
      String(
        result.medicineDays || ""
      ).trim();


    currentPickupTime =
      String(
        result.pickupTime || ""
      ).trim();


    /********************************
     * 顯示資料
     ********************************/

    document
      .getElementById(
        "name"
      )
      .innerText =
        result.name || "";


    document
      .getElementById(
        "medicineDaysDisplay"
      )
      .innerText =
        currentMedicineDays ||
        "未提供";


    document
      .getElementById(
        "pickupTimeDisplay"
      )
      .innerText =
        currentPickupTime ||
        "未提供";


    document
      .getElementById(
        "status"
      )
      .innerText =
        "已找到您的拿藥申請";


    document
      .getElementById(
        "medicineData"
      )
      .style.display =
        "block";


  } catch(error) {

    console.error(
      error
    );


    document
      .getElementById(
        "status"
      )
      .innerText =
        "拿藥資料查詢失敗：" +
        (
          error.message ||
          String(error)
        );

  }

}


/************************************************
 * 取消原因選擇
 ************************************************/

function reasonChanged() {

  const selected =
    document.querySelector(
      'input[name="cancelReason"]:checked'
    );


  const otherBox =
    document.getElementById(
      "otherReasonBox"
    );


  if (
    selected &&
    selected.value ===
      "其他"
  ) {

    otherBox.style.display =
      "block";

  } else {

    otherBox.style.display =
      "none";


    document
      .getElementById(
        "otherReason"
      )
      .value =
        "";

  }

}


/************************************************
 * 取得取消原因
 ************************************************/

function getCancelReason() {

  const selected =
    document.querySelector(
      'input[name="cancelReason"]:checked'
    );


  if (
    !selected
  ) {

    return "";

  }


  /*
   * 其他可以不輸入文字
   */
  if (
    selected.value ===
      "其他"
  ) {

    const otherText =
      document
        .getElementById(
          "otherReason"
        )
        .value
        .trim();


    if (
      otherText
    ) {

      return (
        "其他：" +
        otherText
      );

    }


    return "其他";

  }


  return selected.value;

}


/************************************************
 * 執行取消
 ************************************************/

async function cancelMedicine() {

  /********************************
   * 確認已有原資料
   ********************************/

  if (
    !currentRowNumber
  ) {

    alert(
      "找不到原始拿藥資料"
    );

    return;

  }


  /********************************
   * 必選取消原因
   ********************************/

  const cancelReason =
    getCancelReason();


  if (
    !cancelReason
  ) {

    alert(
      "請選擇取消原因"
    );

    return;

  }


  /********************************
   * POST 內容
   ********************************/

  const payload = {

    action:
      "cancelMedicine",

    rowNumber:
      currentRowNumber,

    userID:
      currentUserID,

    userName:
      currentUserName,

    medicineDays:
      currentMedicineDays,

    pickupTime:
      currentPickupTime,

    cancelReason:
      cancelReason

  };


  /********************************
   * 防止重複點擊
   ********************************/

  const button =
    document.getElementById(
      "cancelButton"
    );


  button.disabled =
    true;


  button.innerText =
    "送出中...";


  try {

    const response =
      await fetch(
        GAS_URL,
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify(
              payload
            )

        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "GAS 回應異常"
      );

    }


    const result =
      await response.json();


    if (
      !result.success
    ) {

      throw new Error(
        result.message ||
        "取消失敗"
      );

    }


    /********************************
     * 成功
     ********************************/

    document
      .getElementById(
        "mainCard"
      )
      .style.display =
        "none";


    document
      .getElementById(
        "successPage"
      )
      .style.display =
        "block";


    window.scrollTo({

      top: 0,

      behavior:
        "smooth"

    });


  } catch(error) {

    console.error(
      error
    );


    button.disabled =
      false;


    button.innerText =
      "確認取消";


    alert(
      "送出失敗：" +
      (
        error.message ||
        String(error)
      )
    );

  }

}

</script>

</body>

</html>
