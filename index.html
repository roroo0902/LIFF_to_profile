<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <title>取消拿藥</title>
</head>

<body>

  <h2>取消拿藥申請</h2>

  <div id="status">
    LINE 資料讀取中...
  </div>

  <div id="medicineData" style="display:none;">

    <p>
      姓名：
      <span id="name"></span>
    </p>

    <p>
      拿藥天數：
      <span id="medicineDays"></span>
    </p>

    <p>
      預計取藥時間：
      <span id="pickupTime"></span>
    </p>

    <textarea
      id="cancelReason"
      placeholder="取消原因（選填）"
    ></textarea>

    <br><br>

    <button onclick="cancelMedicine()">
      確認取消
    </button>

  </div>


<script>

const LIFF_ID =
  "你的LIFF_ID";

const GAS_URL =
  "你的GAS Web App /exec網址";


let currentUserID = "";
let currentUserName = "";

let currentRowNumber = null;


/*********************************
 * 初始化
 *********************************/
window.onload = async function () {

  try {

    await liff.init({
      liffId: LIFF_ID
    });


    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }


    const profile =
      await liff.getProfile();


    currentUserID =
      profile.userId;

    currentUserName =
      profile.displayName;


    document.getElementById(
      "status"
    ).innerText =
      "正在查詢您的拿藥資料...";


    await loadMedicineData();


  } catch (error) {

    document.getElementById(
      "status"
    ).innerText =
      "LINE資料取得失敗：" +
      error.message;

  }

};


/*********************************
 * 查詢拿藥資料
 *********************************/
async function loadMedicineData() {

  const url =
    GAS_URL +
    "?action=getLatest" +
    "&userID=" +
    encodeURIComponent(
      currentUserID
    );


  const response =
    await fetch(url);


  const result =
    await response.json();


  if (!result.found) {

    document.getElementById(
      "status"
    ).innerText =
      "目前沒有可取消的拿藥申請";

    return;

  }


  currentRowNumber =
    result.rowNumber;


  document.getElementById(
    "name"
  ).innerText =
    result.name;


  document.getElementById(
    "medicineDays"
  ).innerText =
    result.medicineDays;


  document.getElementById(
    "pickupTime"
  ).innerText =
    result.pickupTime;


  document.getElementById(
    "status"
  ).innerText =
    "找到您的拿藥申請";


  document.getElementById(
    "medicineData"
  ).style.display =
    "block";

}


/*********************************
 * 取消
 *********************************/
async function cancelMedicine() {

  const cancelReason =
    document
      .getElementById(
        "cancelReason"
      )
      .value
      .trim();


  const payload = {

    action:
      "cancelMedicine",

    rowNumber:
      currentRowNumber,

    userID:
      currentUserID,

    userName:
      currentUserName,

    cancelReason:
      cancelReason

  };


  const response =
    await fetch(
      GAS_URL,
      {

        method:
          "POST",

        body:
          JSON.stringify(
            payload
          )

      }
    );


  const result =
    await response.json();


  if (result.success) {

    alert(
      "已成功取消拿藥申請"
    );


    document.getElementById(
      "medicineData"
    ).style.display =
      "none";


    document.getElementById(
      "status"
    ).innerText =
      "✅ 已完成取消";


  } else {

    alert(
      result.message ||
      "取消失敗"
    );

  }

}

</script>

</body>

</html>
